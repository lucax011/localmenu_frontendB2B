# Versão de produção do painel (build estático servido pelo Nginx).
# A porta fica presa a 127.0.0.1 e é a mesma do dev (8081), que o CORS da API já libera.
services:
  web:
    build:
      context: .
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:3000}
    ports:
      - '127.0.0.1:8081:80'
